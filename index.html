<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    
    <!-- 首屏关键 CSS 内联 - 防止主题闪烁 -->
    <style>
      :root { --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; --bg-color: #f5f7fa; --card-bg: #fff; --text-primary: #1f2937; --text-secondary: #6b7280; --border-color: #e5e7eb; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; min-height: 100%; overflow-x: hidden; }
      body { font-family: var(--font-sans); background-color: var(--bg-color); color: var(--text-primary); line-height: 1.6; -webkit-font-smoothing: antialiased; }
      body.dark-mode { --bg-color: #141414; --card-bg: #1f1f1f; --text-primary: #e6e6e6; --text-secondary: #a6a6a6; --border-color: #303030; }
    </style>

    <!-- Favicon - 紫蓝渐变盾牌+钥匙设计 -->
    <!-- Google 搜索结果使用 PNG 格式 -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- 视口设置 - 优化移动端显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <!-- SEO 元数据 - Enhanced for better search rankings -->
    <meta name="description" content="Free online encryption toolkit with 44+ cryptographic tools: AES, DES, RSA, ECC, FPE, HSM key management (Thales, Futurex, Atalla, SafeNet), TR-31 key blocks, KCV, PIN blocks, CVV/CVC, DUKPT, MAC algorithms, ASN.1, SSL certificates, hash calculator, and more. 100% client-side, no data leaves your device." />
    <meta name="keywords" content="HSM Kit, encryption tools, AES encryption online, DES encryption, 3DES calculator, RSA encryption, ECC ECDSA, TR-31 key block parser, KCV calculator, key check value, PIN block generator, ISO 9564, ASN.1 parser, DER decoder, key generator, cryptography tools, payment security, ANSI X9.143, format preserving encryption, FPE, MD5 hash generator, SHA256 calculator, Base64 encoder decoder, UUID generator online, ISO 8583 message parser, BCD converter, character encoding converter, Luhn check digit, EBCDIC ASCII converter, HSM key management, Futurex keys, Atalla AKB, SafeNet keys, Thales LMK, keyshare generator, SSL certificate parser, X509 certificate, RSA DER public key" />
    <meta name="author" content="HSM Kit" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / 社交媒体分享 -->
    <!-- 建议创建 1200x630 的 OG 图片以获得最佳社交分享效果 -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hsmkit.com/" />
    <meta property="og:title" content="HSM Kit - Free Online Encryption & Key Management Tools" />
    <meta property="og:description" content="Free online encryption toolkit with 44+ cryptographic tools: AES, DES, RSA, ECC, FPE, HSM key management, TR-31 key blocks, KCV, PIN blocks, CVV/CVC, DUKPT, MAC algorithms, and more. 100% client-side, completely free." />
    <meta property="og:image" content="https://hsmkit.com/favicon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="HSM Kit - Free Online Encryption Tools" />
    <meta property="og:site_name" content="HSM Kit" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HSM Kit - Free Online Encryption Tools" />
    <meta name="twitter:description" content="44+ free cryptographic tools: AES, DES, RSA, ECC, FPE, HSM key management, TR-31, KCV, PIN blocks, CVV/CVC, DUKPT, MAC, ASN.1, SSL, and more. 100% client-side." />
    <meta name="twitter:image" content="https://hsmkit.com/favicon-512.png" />
    <meta name="twitter:image:alt" content="HSM Kit - Free Online Encryption Tools" />
    
    <!-- 主题颜色 - 紫蓝渐变主色 -->
    <meta name="theme-color" content="#8B5CF6" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://hsmkit.com/" />
    
    <!-- Hreflang for multilingual SEO -->
    <!-- Note: Tool pages use client-side language switching (same URL for all languages).
         Only guide pages have language-specific URLs (/zh/guides, /ja/guides, etc.).
         Dynamic hreflang for guides is injected in GuideDetailPage.tsx. -->
    <link rel="alternate" hreflang="en" href="https://hsmkit.com/" />
    <link rel="alternate" hreflang="zh" href="https://hsmkit.com/" />
    <link rel="alternate" hreflang="x-default" href="https://hsmkit.com/" />
    
    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://hsmkit.com/#organization",
      "name": "HSM Kit",
      "url": "https://hsmkit.com",
      "logo": "https://hsmkit.com/favicon-512.png",
      "description": "Professional cryptographic tools for developers and security engineers: encryption, HSM key management, payment security, PKI tools, and more. 100% client-side, completely free.",
      "sameAs": [
        "https://github.com/hsm-kit/hsmkit"
      ]
    }
    </script>
    
    <!-- WebSite Schema for Sitelinks Search Box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://hsmkit.com/#website",
      "name": "HSM Kit",
      "url": "https://hsmkit.com/",
      "publisher": { "@id": "https://hsmkit.com/#organization" }
    }
    </script>
    
    <!-- PWA Manifest is auto-injected by vite-plugin-pwa -->
    
    <title>HSM Kit - Free Online Encryption & Key Management Tools</title>
  </head>
  <body suppressHydrationWarning>
    <!-- 主题初始化脚本 - 在 React 加载前执行，避免闪烁 -->
    <script>
      (function() {
        var theme = localStorage.getItem('hsmkit-theme');
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.body.classList.add('dark-mode');
          document.body.style.backgroundColor = '#141414';
          document.documentElement.style.setProperty('--bg-color', '#141414');
        } else {
          document.body.style.backgroundColor = '#f5f7fa';
          document.documentElement.style.setProperty('--bg-color', '#f5f7fa');
        }
        document.documentElement.setAttribute('data-theme', theme);

      })();
    </script>

    <noscript>
      <p><strong>HSM Kit - Free Online Cryptographic Toolkit (44+ Tools)</strong></p>
      <p>HSM Kit requires JavaScript to run. Please enable JavaScript in your browser to use the tools.</p>
      <h2>Available Tools (44+):</h2>
      <p><strong>Encryption:</strong> AES, DES/3DES, RSA, ECC/ECDSA, Format-Preserving Encryption (FPE)</p>
      <p><strong>HSM Key Management:</strong> Futurex, Atalla, SafeNet, Thales key encryption/decryption, TR-31 key blocks, Thales key blocks, keyshare generation, KCV calculator</p>
      <p><strong>Payment Security:</strong> PIN blocks (ISO 9564 all formats), PIN offset (IBM 3624), PIN PVV (VISA), CVV/CVV2/iCVV/dCVV, Amex CSC (CSC3/4/5), Mastercard CVC3, DUKPT (ISO 9797 & AES), ISO 8583 bitmap parser, AS2805 parser</p>
      <p><strong>MAC Algorithms:</strong> ISO 9797-1, ANSI X9.9/X9.19, AS2805 MAC, 3DES CBC-MAC, HMAC, AES-CMAC, 3DES-CMAC, Retail MAC</p>
      <p><strong>PKI Tools:</strong> ASN.1 DER/BER parser, SSL/TLS certificate parser (X.509), RSA DER public key decoder, VISA certificate validation</p>
      <p><strong>Utilities:</strong> Hash calculator (MD5, SHA, SHA-3, BLAKE2, etc.), character encoding converter, BCD encoder/decoder, check digits calculator (Luhn, Mod 10/9), Base64/Base94 encoder/decoder, UUID generator, ZKA session key derivation</p>
      <p><strong>Privacy:</strong> All calculations are performed client-side in your browser. No data is sent to any server.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" data-cfasync="false" src="/src/main.tsx"></script>
  </body>
</html>
