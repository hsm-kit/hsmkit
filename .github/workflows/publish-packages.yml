name: Publish Packages and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm and MCP packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.RELEASE_VERSION.replace(/^v/, '');
          const files = [
            'packages/crypto-tools/package.json',
            'packages/mcp-server/package.json',
            'packages/mcp-server/server.json',
          ];
          for (const file of files) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (value !== version) throw new Error(`${file} version ${value} does not match tag ${version}`);
          }
          NODE

      - name: Test and build packages
        run: |
          npm run test:packages
          npm run build:packages
          npm run test:e2e -w @hsmkit/mcp-server

      - name: Publish core package
        run: |
          VERSION=$(node -p "require('./packages/crypto-tools/package.json').version")
          if npm view "@hsmkit/crypto-tools@$VERSION" version >/dev/null 2>&1; then
            echo "@hsmkit/crypto-tools@$VERSION is already published"
          else
            npm publish -w @hsmkit/crypto-tools --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish MCP package
        run: |
          VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          if npm view "@hsmkit/mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "@hsmkit/mcp-server@$VERSION is already published"
          else
            npm publish -w @hsmkit/mcp-server --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install MCP Registry publisher
        run: |
          curl --fail --location "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz -C "$RUNNER_TEMP" mcp-publisher

      - name: Publish to MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish packages/mcp-server/server.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "HSM Kit ${GITHUB_REF_NAME}" \
            --generate-notes \
            public/test-vectors/aes.json \
            packages/mcp-server/server.json